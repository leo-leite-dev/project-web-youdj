name: Supabase local tests

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pgtap:
    name: pgTAP local
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations to local database
        run: supabase db reset --local --no-seed --yes

      - name: Run pgTAP tests (local only)
        run: supabase test db --local supabase/tests

      - name: Stop local Supabase
        if: always()
        continue-on-error: true
        run: supabase stop --no-backup
